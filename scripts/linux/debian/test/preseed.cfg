#_preseed_V1
### Locale and Keyboard
d-i debian-installer/locale string en_ZA.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select eth0
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string 10.0.0.2
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 10.0.0.1
d-i netcfg/get_nameservers string 1.1.1.1
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string tcyclops
d-i netcfg/get_domain string homelab.zezura.cc
d-i netcfg/hostname string tcyclops

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

### User
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$aRlcXRzZ1rRHRzrY$BRAeqYfxvw1eIB7aHVGuJZu/ClAT.lKuMBrfbWh6AbimNouXbJigB2bhx3afvqDNoOhZqSRX0r9oG090DjszG. # CHANGES POST OS INSTALL
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Ansible User
d-i passwd/username string ansible-user
d-i passwd/user-password-crypted password $6$oEnWo2a0seWuHGr/$..DAjdI/5t1vIXLRP5EVQtNs1znkdzcEJBsM5mvnJOBTbINoiHvIqU15OQxG7A8nA2nafoYHhnToHNwLOjAg71 # CHANGES POST OS INSTALL
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

### Clock and Timezone
d-i clock-setup/utc boolean true
d-i time/zone string Africa/Johannesburg
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string pool.ntp.org

### Disk Partitioning
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
d-i partman-auto/expert_recipe_file string /cdrom/recipes/lvm.recipe
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/sda

### APT
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Finishing
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
