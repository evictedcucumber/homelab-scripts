name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax)
        run: find scripts -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: shellcheck
        run: find scripts -name '*.sh' -print0 | xargs -0 -r shellcheck --shell=bash

      - name: shfmt (advisory)
        continue-on-error: true
        run: |
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64" -o "$RUNNER_TEMP/shfmt"
          chmod +x "$RUNNER_TEMP/shfmt"
          "$RUNNER_TEMP/shfmt" -d -i 4 -ci scripts

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          # Write-Host is intentional for coloured console output in these
          # interactive admin scripts.
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
              $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          }
          $errs = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errs.Count -gt 0) {
              throw "PSScriptAnalyzer reported $($errs.Count) error(s)"
          }
